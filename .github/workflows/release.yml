name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GitHub release upload

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The packager also accepts the legacy names CF_API_KEY / GITHUB_OAUTH directly;
      # the documented names are CF_API_TOKEN / GITHUB_API_TOKEN.
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for version + changelog

      # Game version comes from the TOC: Interface 16001 maps to game type "forever",
      # version 1.60.1 (CurseForge game version type 88568). Nothing to pass here.
      # If CurseForge ever rejects it, add `-g 1.60.1` to args.
      # CurseForge upload also needs a project id: add `-p <id>` here (or
      # `## X-Curse-Project-ID:` in the TOC) once the project exists.
      - uses: BigWigsMods/packager@v2
